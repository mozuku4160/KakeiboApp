<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://pjdbmpclqjhkdxnkgymd.supabase.co wss://pjdbmpclqjhkdxnkgymd.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ふたりの家計簿</title>
<link rel="stylesheet" href="./style.css?v=8">
</head>
<body>
<main>

<div id="boot" class="sub boot">読み込み中…</div>

<section id="login" class="hide">
  <h1>ふたりの家計簿</h1>
  <div class="card">
    <input id="em" type="email" autocomplete="username" placeholder="メールアドレス">
    <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード">
    <button class="go" id="li">ログイン</button>
  </div>
</section>

<section id="app" class="hide">
  <div class="top"><h1>ふたりの家計簿</h1><button id="lo" class="txt">ログアウト</button></div>
  <div id="st" class="err"></div>

  <div class="card">
    <div class="mon"><button id="pv" aria-label="前の月">‹</button><b id="ml"></b><button id="nx" aria-label="次の月">›</button></div>
    <div class="big" id="tot"></div>
    <div class="sub" id="pa"></div>
    <div class="tabs" id="tabs">
      <button data-t="breakdown" class="on">今月の内訳</button>
      <button data-t="compare">前月比</button>
      <button data-t="trend">6か月推移</button>
    </div>
    <div id="panel"></div>
  </div>

  <div class="card" id="list"></div>

  <button class="ghost mb12" id="rm">🔁 固定費の管理</button>

  <button class="go mb12" id="ex">CSVで書き出し(バックアップ)</button>

  <details class="card"><summary class="sub">名前を変更</summary>
    <div class="row mt10"><input id="na" aria-label="1人目の名前"><input id="nb" aria-label="2人目の名前"></div>
    <button class="go" id="sn">保存</button>
  </details>

  <div class="spacer"></div>

  <button id="fab" class="fab" aria-label="記録を追加">＋</button>

  <div id="ov" class="ov hide"></div>
  <div id="sheet" class="sheet hide" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div class="grab"></div>
    <div class="sh-head"><b id="sh-t">記録を追加</b><button id="sh-x" class="txt">閉じる</button></div>
    <div id="sh-st" class="err"></div>

    <label class="lbl" for="amt">金額</label>
    <div class="amtwrap"><span>¥</span><input id="amt" type="number" inputmode="numeric" placeholder="0"></div>

    <label class="tog" id="reprow"><span>🔁 毎月くり返す(固定費)</span><input type="checkbox" id="rep"></label>
    <div id="repbox" class="repbox hide">
      <div class="row">
        <div><label class="lbl" for="rday">毎月</label><select id="rday"></select></div>
        <div><label class="lbl" for="rend">終了月(任意)</label><input type="month" id="rend"></div>
      </div>
      <div class="sub mb12">次の月から、この内容の記録が自動で追加されます。</div>
    </div>
    <div id="repnote" class="sub mb12 hide">🔁 固定費から自動で作られた記録です。金額などは、この月の分だけ直せます。毎月の設定は「固定費の管理」で変更します。</div>

    <div class="lbl">カテゴリ</div>
    <button type="button" id="catbtn" class="catbtn" aria-haspopup="dialog"></button>

    <div class="lbl">払った人</div>
    <div class="seg" id="payer"></div>

    <label class="lbl" for="d">日付</label>
    <input type="date" id="d">

    <label class="lbl" for="memo">メモ(任意)</label>
    <input id="memo" placeholder="例:スーパー">

    <button class="go mt14" id="save">追加</button>
    <button class="danger hide" id="del">この記録を削除</button>
  </div>

  <div id="cov" class="ov ov2 hide"></div>
  <div id="cpick" class="sheet cpick hide" role="dialog" aria-modal="true" aria-labelledby="cp-t">
    <div class="grab"></div>
    <div class="sh-head"><b id="cp-t">カテゴリを選択</b><button type="button" id="cp-x" class="txt">閉じる</button></div>
    <div class="cats" id="cats"></div>
  </div>

  <div id="rov" class="ov hide"></div>
  <div id="rsheet" class="sheet hide" role="dialog" aria-modal="true" aria-labelledby="rs-t">
    <div class="grab"></div>
    <div class="sh-head"><b id="rs-t">固定費の管理</b><button type="button" id="rs-x" class="txt">閉じる</button></div>
    <div class="sub mb12">毎月自動で追加される記録です。金額を変えると、次に作られる月から反映されます(作成済みの記録は変わりません)。</div>
    <div id="rlist"></div>
  </div>

  <div id="eov" class="ov ov2 hide"></div>
  <div id="redit" class="sheet cpick hide" role="dialog" aria-modal="true" aria-labelledby="re-t">
    <div class="grab"></div>
    <div class="sh-head"><b id="re-t">固定費を編集</b><button type="button" id="re-x" class="txt">閉じる</button></div>
    <div id="re-st" class="err"></div>
    <div id="rinfo" class="cmp-sum"></div>
    <label class="lbl" for="ramt">金額</label>
    <div class="amtwrap"><span>¥</span><input id="ramt" type="number" inputmode="numeric"></div>
    <div class="row">
      <div><label class="lbl" for="rday2">毎月</label><select id="rday2"></select></div>
      <div><label class="lbl" for="rend2">終了月(任意)</label><input type="month" id="rend2"></div>
    </div>
    <label class="lbl" for="rmemo">メモ(任意)</label>
    <input id="rmemo">
    <label class="tog"><span>自動で追加する</span><input type="checkbox" id="ract"></label>
    <button class="go" id="rsave">保存</button>
    <button class="danger" id="rdel">この固定費を削除</button>
  </div>
</section>

</main>

<script src="./supabase.min.js"></script>
<script src="./app.js?v=8"></script>
</body>
</html>
